<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Séries</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="box">
    <h1>Cadastro de Séries</h1>
     
    <form method="post">
        <div class="texto">
    Titulo: <input type="text" name="titulo" id="titulo" required>
    
    <br><br>
    
    Quantidade de Episodios: <input type="number" name="quantidade" id="qtd" required>
    
    <br><br>

    Descrição: <input type="text" name="descrição" id="desc" required> 
    
    <br><br>

    Autor: <input type="text" name="autor" id="autor" required>
    </div>
    <br><br>

    <button type="button" onClick="cadastrar()">Cadastrar</button>

    <br><br>
</form>


    </div>


    <script src="js/script.js"></script>
</body>
</html>
